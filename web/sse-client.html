<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scudd SSE Event Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f23;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #50fa7b;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: #8b949e;
            margin-bottom: 20px;
            font-size: 0.9em;
        }

        .status-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .status-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px 20px;
            flex: 1;
            min-width: 200px;
        }

        .status-card h3 {
            color: #8b949e;
            font-size: 0.8em;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .status-card .value {
            font-size: 1.5em;
            font-weight: bold;
            color: #58a6ff;
        }

        .status-card .value.connected {
            color: #50fa7b;
        }

        .status-card .value.disconnected {
            color: #ff7b72;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            background: #238636;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
        }

        button:hover {
            background: #2ea043;
        }

        button:disabled {
            background: #30363d;
            cursor: not-allowed;
        }

        button.stop {
            background: #da3633;
        }

        button.stop:hover {
            background: #f85149;
        }

        .filters {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group label {
            color: #8b949e;
            font-size: 0.9em;
        }

        .filter-group select {
            background: #0d1117;
            color: #e0e0e0;
            border: 1px solid #30363d;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9em;
        }

        .events-container {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
        }

        .events-header {
            background: #161b22;
            padding: 15px;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .events-header h2 {
            font-size: 1.2em;
            color: #e0e0e0;
        }

        .events-list {
            max-height: 600px;
            overflow-y: auto;
            padding: 10px;
        }

        .event-item {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .event-type {
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            text-transform: uppercase;
        }

        .event-type.token_usage { background: #58a6ff; color: white; }
        .event-type.cost_update { background: #50fa7b; color: #0f0f23; }
        .event-type.budget_alert { background: #ff7b72; color: white; }
        .event-type.task_complete { background: #a371f7; color: white; }
        .event-type.task_start { background: #79c0ff; color: #0f0f23; }
        .event-type.model_switch { background: #ffa657; color: #0f0f23; }
        .event-type.heartbeat { background: #30363d; color: #8b949e; }
        .event-type.system_start { background: #238636; color: white; }

        .event-timestamp {
            color: #8b949e;
            font-size: 0.8em;
        }

        .event-data {
            background: #0d1117;
            border-radius: 4px;
            padding: 10px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.85em;
            overflow-x: auto;
        }

        .event-data pre {
            margin: 0;
            color: #e0e0e0;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #8b949e;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* Scrollbar styling */
        .events-list::-webkit-scrollbar {
            width: 8px;
        }

        .events-list::-webkit-scrollbar-track {
            background: #0d1117;
        }

        .events-list::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }

        .events-list::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📡 Scudd SSE Event Viewer</h1>
        <p class="subtitle">Real-time token usage and cost monitoring via Server-Sent Events</p>

        <div class="status-bar">
            <div class="status-card">
                <h3>Status</h3>
                <div class="value disconnected" id="status">Disconnected</div>
            </div>
            <div class="status-card">
                <h3>Events Received</h3>
                <div class="value" id="eventCount">0</div>
            </div>
            <div class="status-card">
                <h3>Uptime</h3>
                <div class="value" id="uptime">0s</div>
            </div>
        </div>

        <div class="controls">
            <button id="connectBtn" onclick="toggleConnection()">🔌 Connect</button>
            <button onclick="clearEvents()">🗑️ Clear Events</button>
            <button onclick="exportEvents()">💾 Export JSON</button>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label>Filter by type:</label>
                <select id="eventTypeFilter" onchange="applyFilter()">
                    <option value="all">All Events</option>
                    <option value="token_usage">Token Usage</option>
                    <option value="cost_update">Cost Update</option>
                    <option value="budget_alert">Budget Alert</option>
                    <option value="task_complete">Task Complete</option>
                    <option value="task_start">Task Start</option>
                    <option value="model_switch">Model Switch</option>
                    <option value="heartbeat">Heartbeat</option>
                </select>
            </div>
        </div>

        <div class="events-container">
            <div class="events-header">
                <h2>Live Event Stream</h2>
                <div style="color: #8b949e; font-size: 0.9em;">
                    Auto-scroll: <input type="checkbox" id="autoScroll" checked>
                </div>
            </div>
            <div class="events-list" id="eventsList">
                <div class="empty-state">
                    <svg fill="currentColor" viewBox="0 0 16 16">
                        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                        <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/>
                    </svg>
                    <p>Click "Connect" to start receiving events</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let eventSource = null;
        let events = [];
        let connectedAt = null;
        let uptimeInterval = null;

        function toggleConnection() {
            if (eventSource) {
                disconnect();
            } else {
                connect();
            }
        }

        function connect() {
            const url = 'http://localhost:8001/events';
            eventSource = new EventSource(url);

            eventSource.onopen = () => {
                updateStatus(true);
                connectedAt = Date.now();
                uptimeInterval = setInterval(updateUptime, 1000);
                console.log('✅ SSE connected');
            };

            eventSource.onerror = (error) => {
                console.error('❌ SSE error:', error);
                updateStatus(false);
                if (uptimeInterval) {
                    clearInterval(uptimeInterval);
                    uptimeInterval = null;
                }
            };

            // Listen for all events
            eventSource.addEventListener('token_usage', (e) => handleEvent(e, 'token_usage'));
            eventSource.addEventListener('cost_update', (e) => handleEvent(e, 'cost_update'));
            eventSource.addEventListener('budget_alert', (e) => handleEvent(e, 'budget_alert'));
            eventSource.addEventListener('task_complete', (e) => handleEvent(e, 'task_complete'));
            eventSource.addEventListener('task_start', (e) => handleEvent(e, 'task_start'));
            eventSource.addEventListener('model_switch', (e) => handleEvent(e, 'model_switch'));
            eventSource.addEventListener('heartbeat', (e) => handleEvent(e, 'heartbeat'));
            eventSource.addEventListener('system_start', (e) => handleEvent(e, 'system_start'));

            document.getElementById('connectBtn').textContent = '🔌 Disconnect';
            document.getElementById('connectBtn').classList.add('stop');
        }

        function disconnect() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            if (uptimeInterval) {
                clearInterval(uptimeInterval);
                uptimeInterval = null;
            }
            updateStatus(false);
            document.getElementById('connectBtn').textContent = '🔌 Connect';
            document.getElementById('connectBtn').classList.remove('stop');
            console.log('🔌 SSE disconnected');
        }

        function updateStatus(connected) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = connected ? 'Connected' : 'Disconnected';
            statusEl.className = 'value ' + (connected ? 'connected' : 'disconnected');
        }

        function updateUptime() {
            if (!connectedAt) return;
            const elapsed = Math.floor((Date.now() - connectedAt) / 1000);
            document.getElementById('uptime').textContent = formatDuration(elapsed);
        }

        function formatDuration(seconds) {
            if (seconds < 60) return `${seconds}s`;
            if (seconds < 3600) return `${Math.floor(seconds / 60)}m ${seconds % 60}s`;
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            return `${h}h ${m}m`;
        }

        function handleEvent(e, type) {
            try {
                const data = JSON.parse(e.data);
                const event = {
                    type: type,
                    timestamp: data.timestamp,
                    data: data.data
                };

                events.unshift(event); // Add to beginning
                if (events.length > 100) events.pop(); // Keep last 100

                updateEventCount();
                renderEvent(event);
            } catch (error) {
                console.error('Failed to parse event:', error);
            }
        }

        function updateEventCount() {
            document.getElementById('eventCount').textContent = events.length;
        }

        function renderEvent(event) {
            const eventsList = document.getElementById('eventsList');
            const filter = document.getElementById('eventTypeFilter').value;

            // Check filter
            if (filter !== 'all' && event.type !== filter) {
                return;
            }

            // Remove empty state if present
            const emptyState = eventsList.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            const eventEl = document.createElement('div');
            eventEl.className = 'event-item';
            eventEl.dataset.type = event.type;

            const timestamp = new Date(event.timestamp).toLocaleTimeString();

            eventEl.innerHTML = `
                <div class="event-header">
                    <span class="event-type ${event.type}">${event.type.replace(/_/g, ' ')}</span>
                    <span class="event-timestamp">${timestamp}</span>
                </div>
                <div class="event-data">
                    <pre>${JSON.stringify(event.data, null, 2)}</pre>
                </div>
            `;

            eventsList.insertBefore(eventEl, eventsList.firstChild);

            // Auto-scroll
            if (document.getElementById('autoScroll').checked) {
                eventsList.scrollTop = 0;
            }

            // Limit displayed events
            while (eventsList.children.length > 50) {
                eventsList.removeChild(eventsList.lastChild);
            }
        }

        function applyFilter() {
            const filter = document.getElementById('eventTypeFilter').value;
            const eventsList = document.getElementById('eventsList');

            // Clear current display
            eventsList.innerHTML = '';

            // Re-render filtered events
            const filteredEvents = filter === 'all'
                ? events
                : events.filter(e => e.type === filter);

            if (filteredEvents.length === 0) {
                eventsList.innerHTML = `
                    <div class="empty-state">
                        <p>No events match the current filter</p>
                    </div>
                `;
                return;
            }

            filteredEvents.forEach(event => renderEvent(event));
        }

        function clearEvents() {
            events = [];
            updateEventCount();
            document.getElementById('eventsList').innerHTML = `
                <div class="empty-state">
                    <svg fill="currentColor" viewBox="0 0 16 16">
                        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                        <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/>
                    </svg>
                    <p>Click "Connect" to start receiving events</p>
                </div>
            `;
        }

        function exportEvents() {
            const dataStr = JSON.stringify(events, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);

            const exportFileDefaultName = 'scudd-events-' + new Date().toISOString().slice(0,10) + '.json';

            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
        }
    </script>
</body>
</html>
